# Two services out of one image, because there are two listeners and each one
# should be the process docker signals. A single container would need something
# in front of them to fan the signal out, and a stop that does not reach the
# game server is a stop that loses where everyone was standing.
#
# Copy .env.example to .env and set LAVA_RES_DIR before the first up.

services:
  game:
    build: .
    image: lava-server
    container_name: lava-game
    restart: unless-stopped
    # Time for shutdown() to warn every session, save each character and let
    # the writers drain. The default ten seconds is enough today and will not
    # stay enough.
    stop_grace_period: 30s
    # PID 1 ignores signals it has no handler for, and the reaper costs
    # nothing; server.py installs its own handlers, so this is belt and
    # braces rather than the thing that makes the stop work.
    init: true
    environment:
      LAVA_PORT: "9775"
      LAVA_HOST: "0.0.0.0"
      LAVA_DB: /var/lib/lava/lava.db
      LAVA_RES: /res
      LAVA_LOG_LEVEL: ${LAVA_LOG_LEVEL:-INFO}
      # 843 is Flash's own port for the socket policy and it is privileged,
      # which the unprivileged user in the image cannot take. The policy is
      # answered inline on the game port anyway. Set it to 843 and add
      # cap_add: [NET_BIND_SERVICE] if a client ever turns out to need it.
      LAVA_POLICY_PORT: ${LAVA_POLICY_PORT:-0}
    ports:
      # The game socket is the one thing that has to reach the player.
      - "${LAVA_BIND:-0.0.0.0}:${LAVA_GAME_PORT:-9775}:9775"
    volumes:
      # The player's own client, read-only: the server reads locations,
      # database/mobs.xml and database/objects.xml out of it and writes
      # nothing. Not in the image and not in the repository.
      - ${LAVA_RES_DIR:?set LAVA_RES_DIR to your res/ directory}:/res:ro
      - lava-db:/var/lib/lava
    healthcheck:
      # The socket policy handshake: accept, read, write, and no session left
      # behind. It does show up in the log as a connect/disconnect pair, which
      # is why this asks once a minute rather than every few seconds.
      test: ["CMD", "python3", "healthcheck.py", "game"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

  http:
    build: .
    image: lava-server
    container_name: lava-http
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    depends_on:
      - game
    environment:
      LAVA_HTTP_HOST: "0.0.0.0"
      LAVA_HTTP_PORT: "8080"
      LAVA_DB: /var/lib/lava/lava.db
      LAVA_RES: /res
      # The address and port the registration page tells people to connect to.
      # Not where this container listens: what the player types into the
      # client, so it has to be reachable from outside this machine.
      LAVA_GAME_HOST: ${LAVA_PUBLIC_HOST:-127.0.0.1}
      LAVA_GAME_PORT: ${LAVA_GAME_PORT:-9775}
      # Off: the game's own files are the player's copy, and we do not hand
      # them out. Turning this on also serves csettings_v1.xml, which is what
      # takes the client off its own disk and onto this server for everything.
      LAVA_HTTP_RES: ${LAVA_HTTP_RES:-0}
    ports:
      - "${LAVA_BIND:-0.0.0.0}:${LAVA_HTTP_PORT:-8080}:8080"
    volumes:
      - ${LAVA_RES_DIR:?set LAVA_RES_DIR to your res/ directory}:/res:ro
      - lava-db:/var/lib/lava
    command: ["python3", "bootstrap_http.py"]
    healthcheck:
      test: ["CMD", "python3", "healthcheck.py", "http"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  # A named volume, not a bind mount: the database has to sit on a real Linux
  # filesystem. On a Windows drive mounted into WSL sqlite cannot take the
  # locks WAL needs and quietly falls back to the rollback journal, where the
  # two services block each other (TASKS 1.2).
  lava-db:
