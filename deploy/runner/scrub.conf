# Drop-in for the runner's user unit, installed by deploy/runner/install.sh as
# ~ghrunner/.config/systemd/user/lava-runner.service.d/scrub.conf.
#
# Before every start of the runner -- after a crash, a kill, a reboot, an
# update of this file -- scrub.sh --idle clears what the last run may have
# left: processes in the unit's cgroup, the rootless Docker's containers and
# networks, the whole work folder. The leading "-": the runner starts even if
# the sweep could not run; ci.yml's first step cleans for itself.
[Service]
Environment=DOCKER_HOST=unix://%t/docker.sock
ExecStartPre=-/usr/local/lib/lava-runner/scrub.sh --idle
