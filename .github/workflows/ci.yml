# CI and CD for the server: the suites on every push to main and every pull
# request, and a deploy to production after green suites on every push to
# main.
#
#   preflight  always: are the server's secrets here (if not, says so and
#              the jobs below are skipped -- grey, not red), and does every
#              script, module and JSON table parse.
#   assets     asks the production server's gate for the digest of the test
#              assets (the server's slice of the client, the extras the
#              suites read, the original texts.xml), restores them from the
#              cache under that digest or fetches them, forgets the key, and
#              checks the string table.
#   suite      every server/, data/ and tools/ suite on SQLite, eight at
#              once, longest first by the last run's durations, with the
#              known failures of tools/known_failures.txt and one rerun, four
#              at once, for anything else that fails (none past ten
#              failures: that many is a break, not a crowd); then the check
#              that every suite ran, and once (deploy/ci/merge_shards.sh).
#   postgres   the suites that honour LAVA_DB_URL, each on its own fresh
#              database in a postgres:16-alpine service -- production's
#              database, which the SQLite run does not exercise.
#   deploy     push to main only, after all of them: packs the tree as
#              deploy/deploy.sh would rsync it and hands it to the gate,
#              which backs up, swaps, rebuilds, checks and rolls back on any
#              failure (deploy/remote/lava-gate.sh). One at a time, never
#              cancelled.
#
# Where they run (README «CI/CD», «Раннер»): one self-hosted runner, labels
# self-hosted and lava, on the production host itself -- the user ghrunner,
# at most 4 of the host's 6 cores and 6 GB, below the game in priority, with
# a rootless Docker of its own and no way into /opt or the host's private
# addresses; the gate it reaches like any other machine, by the host's public
# address. One runner: the jobs run one after another, never side by side.
#
# Every job runs in a container of python:3.12-slim, the production image's
# base (Dockerfile): the host has no Python 3.12, and a job leaves nothing on
# it but the checkout. The image has no git, ssh or rsync; the first step of
# every job installs them -- the same list in every job, because the cache
# of the assets is filed under how it was packed (gzip here, no zstd), and a
# job with other tools would not find what another saved. --init, because
# the runner keeps a job's container up with "tail -f /dev/null" as its
# first process, which never reaps an orphan: a server killed with its suite
# past the timeout would stay a zombie, alive to kill(pid, 0), and
# tools/test_suite.py rightly fails on that. docker-init reaps them.
#
# In a container job HOME is /github/home: the runner's temp folder on the
# host, emptied at the start and at the end of every job. The assets, the
# suites' output and the key all live under it. ${{ runner.temp }} and
# ${{ github.workspace }} name the host's paths, which the container does
# not see, so a path an action reads is written ~/..., and a script reads
# $HOME or $RUNNER_TEMP.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY      the private half of the CI key; its public half sits
#                       in root's authorized_keys tied to the gate
#   DEPLOY_KNOWN_HOSTS  the server's host-key line, printed by install.sh
# Optional variable DEPLOY_HOST, if the server ever moves.
#
# Everything this file runs lives in deploy/ci/ and tools/, where it can be run
# by hand and read with its comments; the steps below only call it.

name: ci

on:
  push:
    # main only: its run is the one that deploys. A working branch is tested
    # by its pull request's run, which also checks the merge with main; a
    # push run beside it would test the same code twice, and a branch
    # without a pull request is not on its way to main. A pushed tag is a
    # name for a commit main's run has already tested.
    branches: [main]
    # Prose only: no suite reads these files, and none of them changes what
    # the server runs. A push that touches anything else runs everything.
    # deploy/ci/still_head.sh reads this very list (the first paths-ignore
    # in this file): keep it first, one "- item" a line.
    paths-ignore:
      - README.md
      - TASKS.md
      - UNDONE.md
      - ROADMAP.md
      - PROTOCOL.md
      - recon/**
  pull_request:
    paths-ignore:
      - README.md
      - TASKS.md
      - UNDONE.md
      - ROADMAP.md
      - PROTOCOL.md
      - recon/**

# A newer push to a branch makes the run for the older one moot: cancel it,
# and free the runner. Not on main, where every run may end in a deploy:
# there runs queue up (a third push replaces the one still waiting, never the
# one running).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# bash -eo pipefail (what "shell: bash" means to the runner) rather than sh:
# a failing ssh on the left of a pipe has to fail the step.
defaults:
  run:
    shell: bash

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '159.194.247.90' }}
  # apt in the job containers: no questions, nobody to answer them.
  DEBIAN_FRONTEND: noninteractive

jobs:
  preflight:
    name: preflight
    runs-on: [self-hosted, lava]
    container:
      image: python:3.12-slim
      options: --init
    timeout-minutes: 10
    outputs:
      gate: ${{ steps.keys.outputs.gate }}
    steps:
      # Before the checkout: without git it would fetch a tarball and no
      # repository. The same list in every job (see the top of this file).
      - name: tools the image lacks
        run: |
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      # Whether the secrets are set, as "true"/"false" -- an expression over
      # a secret yields only that, never the secret. A job-level "if:" may
      # not read secrets at all; the jobs below read this output instead.
      - name: the server's secrets
        id: keys
        run: bash deploy/ci/preflight.sh
        env:
          HAVE_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAVE_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}

      - name: every script, module and table parses
        run: bash deploy/ci/syntax.sh

  assets:
    name: assets and string table
    needs: preflight
    if: needs.preflight.outputs.gate == 'true'
    runs-on: [self-hosted, lava]
    container:
      image: python:3.12-slim
      options: --init
    timeout-minutes: 15
    outputs:
      key: ${{ steps.hash.outputs.key }}
    steps:
      - name: tools the image lacks
        run: |
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      - name: gate access
        run: bash deploy/ci/ssh_setup.sh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: digest of the assets on the server
        id: hash
        run: |
          h=$(ssh lava-gate assets-hash)
          if ! [[ $h =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Assets::the gate answered '$h'"
            exit 1
          fi
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          echo "key=lava-assets-$h" >> "$GITHUB_OUTPUT"

      - name: cached copy
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/lava-assets
          key: ${{ steps.hash.outputs.key }}

      - name: fetch from the gate
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash deploy/ci/fetch_assets.sh "$HOME/lava-assets" "$HASH"
        env:
          HASH: ${{ steps.hash.outputs.hash }}

      - name: keep them for the other jobs and later runs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/lava-assets
          key: ${{ steps.hash.outputs.key }}

      # The key has done its work here. The repository's own code runs next
      # (export_texts.py), and nothing it does needs the server.
      - name: forget the key
        if: always()
        run: rm -f "$HOME/.ssh/lava_gate"

      # export_texts.py exits non-zero if any id the server may put on the
      # wire is missing from the table (PROTOCOL.md 9): a missing row is a
      # player sent back to the login screen, not a blank label. The table's
      # sha256 is what the launcher compares (launcher/Updater.cs); the
      # deploy's report says whether the published launcher still carries it.
      - name: string table, every id on the wire in it
        run: |
          export LAVA_RES=$HOME/lava-assets/res
          out=$(python3 tools/export_texts.py -o "$RUNNER_TEMP/texts.xml")
          echo "$out"
          echo "string table: ${out##*/}, 0 ids missing, sha256 $(sha256sum < "$RUNNER_TEMP/texts.xml" | cut -c1-16)" >> "$GITHUB_STEP_SUMMARY"

  suite:
    name: suites on SQLite
    needs: assets
    runs-on: [self-hosted, lava]
    container:
      image: python:3.12-slim
      options: --init
    # Measured at about 14 minutes green on four cores (README «Раннер»); a
    # real failure adds its own length again, rerun.
    timeout-minutes: 60
    steps:
      - name: tools the image lacks
        run: |
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: ~/lava-assets
          key: ${{ needs.assets.outputs.key }}
          fail-on-cache-miss: true

      # The summary.txt the last run left (the merge step below): the order,
      # longest first. None on a first run, and then the static order.
      - name: durations of the last run
        uses: actions/cache/restore@v4
        with:
          path: ~/suite/summary.txt
          key: suite-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: suite-durations-

      # Eight at once on four cores: the suites wait on game clocks, half a
      # core busy on average, and eight of them peak at about 2.3 GB of the
      # 6 GB (twelve: 3.4 GB, two minutes sooner; README «Раннер»). The
      # runner orders the set by the summary.txt in its output folder.
      - name: every suite, eight at once, longest first
        id: run
        run: |
          export LAVA_RES=$HOME/lava-assets/res LAVA_ORIG_TEXTS=$HOME/lava-assets/texts.xml
          mkdir -p "$HOME/suite/sqlite"
          if [ -s "$HOME/suite/summary.txt" ]; then
            cp "$HOME/suite/summary.txt" "$HOME/suite/sqlite/summary.txt"
          fi
          bash tools/run_suite.sh --known tools/known_failures.txt --rerun \
            --summary "$GITHUB_STEP_SUMMARY" . "$HOME/suite/sqlite" 8

      # Every suite of the tree ran, and once: a green run without one would
      # deploy what nothing tested. Its durations are the next run's order,
      # so this runs after a red run as well.
      - name: every suite ran, and once
        id: merge
        if: ${{ !cancelled() && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') }}
        run: |
          trap '[ -s "$HOME/suite/summary.txt" ] && echo "durations=yes" >> "$GITHUB_OUTPUT"' EXIT
          bash deploy/ci/merge_shards.sh "$HOME/suite" "$HOME/suite/summary.txt"

      - name: keep the durations for the next run
        if: ${{ !cancelled() && steps.merge.outputs.durations == 'yes' }}
        uses: actions/cache/save@v4
        with:
          path: ~/suite/summary.txt
          key: suite-durations-${{ github.run_id }}-${{ github.run_attempt }}

      - name: output of every suite
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: ~/suite/sqlite/
          retention-days: 7

  postgres:
    name: suites on Postgres
    needs: assets
    runs-on: [self-hosted, lava]
    container:
      image: python:3.12-slim
      options: --init
    timeout-minutes: 30
    # On the job's own network, by its name (LAVA_PG below); no port on the
    # host. Its data on a tmpfs: in memory, gone with the container, nothing
    # of it left on the runner's disk.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lava
          POSTGRES_PASSWORD: lavatest
          POSTGRES_DB: lava_test
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U lava -d lava_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: tools the image lacks
        run: |
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      # The image's own driver, at the image's own version (Dockerfile).
      - name: psycopg
        run: python3 -m pip install --quiet --no-cache-dir --disable-pip-version-check --root-user-action=ignore "psycopg[binary]==3.2.3"

      - uses: actions/cache/restore@v4
        with:
          path: ~/lava-assets
          key: ${{ needs.assets.outputs.key }}
          fail-on-cache-miss: true

      - name: each suite on a database of its own
        run: |
          export LAVA_RES=$HOME/lava-assets/res LAVA_ORIG_TEXTS=$HOME/lava-assets/texts.xml
          bash deploy/ci/pg_suites.sh "$HOME/pg" 8
        env:
          LAVA_PG: postgresql://lava:lavatest@postgres:5432

      - name: output of every suite
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-logs
          path: ~/pg/
          retention-days: 7

  deploy:
    name: deploy to production
    # preflight among the needs only for its output; a skipped assets (no
    # key) skips suite and postgres, and with them this job.
    needs: [preflight, assets, suite, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.preflight.outputs.gate == 'true'
    runs-on: [self-hosted, lava]
    container:
      image: python:3.12-slim
      options: --init
    timeout-minutes: 30
    # One deploy at a time, and one that has begun is never cancelled: the
    # gate holds its own lock as well, and finishes a deploy -- or rolls it
    # back -- even if this job goes away.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: tools the image lacks
        run: |
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      # A rerun of an old run, or a run that waited behind a newer one, would
      # otherwise put older code over newer -- unless what is newer is prose
      # alone, which starts no run of its own (the script says how).
      - name: still what main runs?
        id: head
        run: bash deploy/ci/still_head.sh

      - name: gate access
        if: steps.head.outputs.go == 'true'
        run: bash deploy/ci/ssh_setup.sh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: pack the tree as deploy.sh would send it
        if: steps.head.outputs.go == 'true'
        run: bash deploy/ci/pack.sh "$RUNNER_TEMP/lava.tgz"

      - name: deploy through the gate
        if: steps.head.outputs.go == 'true'
        run: bash deploy/ci/send.sh "$RUNNER_TEMP/lava.tgz" "$GITHUB_SHA"

      - name: forget the key
        if: always()
        run: rm -f "$HOME/.ssh/lava_gate"
