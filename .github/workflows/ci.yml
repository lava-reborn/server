# CI and CD for the server: the suites on every push to main and every pull
# request, and a deploy to production after green suites on every push to
# main.
#
#   preflight  always: are the server's secrets here (if not, says so and
#              the jobs below are skipped -- grey, not red), and does every
#              script, module and JSON table parse.
#   assets     asks the production server's gate for the digest of the test
#              assets (the server's slice of the client, the extras the
#              suites read, the original texts.xml), restores them from the
#              cache under that digest or fetches them, forgets the key, and
#              checks the string table.
#   suite      every server/, data/, tools/ and client/ suite on SQLite,
#              in three shards side by side, each four at once, longest
#              first by the last run's durations, with the known failures of
#              tools/known_failures.txt and one rerun, four at once, for
#              anything else that fails (none past ten failures: that many is
#              a break, not a crowd).
#   suites     the shards as one: every suite ran, and once
#              (deploy/ci/merge_shards.sh); their durations are the next
#              run's cut.
#   postgres   the suites that honour LAVA_DB_URL, each on its own fresh
#              database in a postgres:16-alpine service -- production's
#              database, which the SQLite run does not exercise. Beside the
#              shards.
#   deploy     push to main only, after all of them: packs the tree as
#              deploy/deploy.sh would rsync it and hands it to the gate,
#              which backs up, swaps, rebuilds, checks and rolls back on any
#              failure (deploy/remote/lava-gate.sh). One at a time, never
#              cancelled.
#
# Where they run (README «CI/CD», «Раннер»): four self-hosted runners,
# labels self-hosted and lava, on the production host itself -- the user
# ghrunner, all four together at most 4 of the host's 6 cores and 6 GB,
# below the game in priority, with one rootless Docker of their own and no
# way into /opt or the host's private addresses; the gate they reach like any
# other machine, by the host's public address. Four jobs at a time, of one
# run or of several: the three shards and Postgres side by side.
#
# Every job runs in a container of python:3.12-slim, the production image's
# base (Dockerfile): the host has no Python 3.12. The image has no git, ssh
# or rsync; the second step of every job installs them -- the same list in
# every job, because the cache of the assets is filed under how it was
# packed (gzip here, no zstd), and a job with other tools would not find
# what another saved. --init, because the runner keeps a job's container up
# with "tail -f /dev/null" as its first process, which never reaps an
# orphan: a server killed with its suite past the timeout would stay a
# zombie, alive to kill(pid, 0), and tools/test_suite.py rightly fails on
# that. docker-init reaps them.
#
# In a container job HOME is /github/home: the runner's temp folder on the
# host, emptied at the start and at the end of every job. The assets and the
# suites' output live under it. ${{ runner.temp }} and ${{ github.workspace }}
# name the host's paths, which the container does not see, so a path an
# action reads is written ~/..., and a script reads $HOME or $RUNNER_TEMP.
#
# Between jobs (README «Раннер», «Между задачами»). The runner is no fresh
# machine per job: its work folder (_work on the host, /__w in the
# container) stays from one job to the next, whichever branch's run the job
# was. The runner itself deletes _actions and downloads the actions again at
# the start of every job, and empties _temp at its start and its end; the
# rest it keeps -- the checkout above all, whose .git actions/checkout would
# reuse, with any hook or config an earlier job wrote into it. So the first
# step of every job deletes everything in /__w but _actions, _temp and _tool,
# and checks that the workspace is where the runner puts it by default (its
# tracking file in _PipelineMapping, which a job can write, says where).
# The key never touches the disk: the two jobs that hold it, assets and
# deploy, keep ~/.ssh on a tmpfs of their container. On the host itself
# deploy/runner/scrub.sh sweeps the work folder before and after every job
# (the runner's job hooks) and whenever the runner starts.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY      the private half of the CI key; its public half sits
#                       in root's authorized_keys tied to the gate
#   DEPLOY_KNOWN_HOSTS  the server's host-key line, printed by install.sh
# Optional variable DEPLOY_HOST, if the server ever moves.
#
# Everything this file runs lives in deploy/ci/ and tools/, where it can be run
# by hand and read with its comments; the steps below only call it.

name: ci

on:
  push:
    # main only: its run is the one that deploys. A working branch is tested
    # by its pull request's run, which also checks the merge with main; a
    # push run beside it would test the same code twice, and a branch
    # without a pull request is not on its way to main. A pushed tag is a
    # name for a commit main's run has already tested.
    branches: [main]
    # Prose only: no suite reads these files, and none of them changes what
    # the server runs. A push that touches anything else runs everything.
    # data/quest_layout.json counts as prose: it is where the quests stand on
    # the quest editor's canvas, nothing but the editor reads it, and moving
    # a card in the admin's editor (a commit of that file alone) must not
    # restart the game.
    # deploy/ci/still_head.sh reads this very list (the first paths-ignore
    # in this file): keep it first, one "- item" a line.
    paths-ignore:
      - README.md
      - TASKS.md
      - UNDONE.md
      - ROADMAP.md
      - PROTOCOL.md
      - recon/**
      - data/quest_layout.json
  pull_request:
    paths-ignore:
      - README.md
      - TASKS.md
      - UNDONE.md
      - ROADMAP.md
      - PROTOCOL.md
      - recon/**
      - data/quest_layout.json

# A newer push to a branch makes the run for the older one moot: cancel it,
# and free the runner. Not on main, where every run may end in a deploy:
# there runs queue up (a third push replaces the one still waiting, never the
# one running).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# bash -eo pipefail (what "shell: bash" means to the runner) rather than sh:
# a failing ssh on the left of a pipe has to fail the step.
defaults:
  run:
    shell: bash

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '159.194.247.90' }}
  # apt in the job containers: no questions, nobody to answer them.
  DEBIAN_FRONTEND: noninteractive
  # The Debian mirror the job containers' apt uses. deb.debian.org (Fastly)
  # does not answer from the production host since 2026-10-08, IPv4 or
  # IPv6, while mirror.yandex.ru does (debian and debian-security alike):
  # every job failed at apt-get with exit 100 and nothing was deployed.
  # A repository variable APT_MIRROR overrides it.
  APT_MIRROR: ${{ vars.APT_MIRROR || 'http://mirror.yandex.ru' }}

jobs:
  preflight:
    name: preflight
    runs-on: [self-hosted, lava]
    container:
      image: python:3.12-slim
      options: --init
    timeout-minutes: 10
    outputs:
      gate: ${{ steps.keys.outputs.gate }}
    steps:
      # Nothing from an earlier job (the top of this file, «Between jobs»):
      # everything in the work folder goes but what the runner renews
      # itself (_actions, _temp) and its tool cache, which no job here
      # reads. The same step in every job. A workspace anywhere but the
      # runner's default fails the job; the tracking file that moved it is
      # gone with the rest, so the next job is back to the default.
      - name: a clean work folder
        run: |
          r=${GITHUB_REPOSITORY#*/}
          find /__w -mindepth 1 -maxdepth 1 ! -name _actions ! -name _temp ! -name _tool -exec rm -rf {} +
          mkdir -p "/__w/$r/$r"
          if [ "$GITHUB_WORKSPACE" != "/__w/$r/$r" ]; then
            echo "::error title=Work folder::the workspace is $GITHUB_WORKSPACE, not /__w/$r/$r: something rewrote the runner's tracking file"
            exit 1
          fi

      # Before the checkout: without git it would fetch a tarball and no
      # repository. The same list in every job (see the top of this file).
      - name: tools the image lacks
        run: |
          sed -i "s#http://deb.debian.org#${APT_MIRROR%/}#g" /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      # Whether the secrets are set, as "true"/"false" -- an expression over
      # a secret yields only that, never the secret. A job-level "if:" may
      # not read secrets at all; the jobs below read this output instead.
      - name: the server's secrets
        id: keys
        run: bash deploy/ci/preflight.sh
        env:
          HAVE_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAVE_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}

      - name: every script, module and table parses
        run: bash deploy/ci/syntax.sh

  assets:
    name: assets and string table
    needs: preflight
    if: needs.preflight.outputs.gate == 'true'
    runs-on: [self-hosted, lava]
    # ~/.ssh on a tmpfs: the key in memory only, gone with the container,
    # never on the runner's disk -- not even when the runner dies before
    # "forget the key" runs. The same in deploy.
    container:
      image: python:3.12-slim
      options: --init --tmpfs /github/home/.ssh:mode=0700,size=1m
    timeout-minutes: 15
    outputs:
      key: ${{ steps.hash.outputs.key }}
      hash: ${{ steps.hash.outputs.hash }}
      durations: ${{ steps.durations.outputs.durations }}
    steps:
      - name: a clean work folder
        run: |
          r=${GITHUB_REPOSITORY#*/}
          find /__w -mindepth 1 -maxdepth 1 ! -name _actions ! -name _temp ! -name _tool -exec rm -rf {} +
          mkdir -p "/__w/$r/$r"
          if [ "$GITHUB_WORKSPACE" != "/__w/$r/$r" ]; then
            echo "::error title=Work folder::the workspace is $GITHUB_WORKSPACE, not /__w/$r/$r: something rewrote the runner's tracking file"
            exit 1
          fi

      - name: tools the image lacks
        run: |
          sed -i "s#http://deb.debian.org#${APT_MIRROR%/}#g" /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      - name: gate access
        run: bash deploy/ci/ssh_setup.sh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: digest of the assets on the server
        id: hash
        run: |
          h=$(ssh lava-gate assets-hash)
          if ! [[ $h =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Assets::the gate answered '$h'"
            exit 1
          fi
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          echo "key=lava-assets-$h" >> "$GITHUB_OUTPUT"

      - name: cached copy
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/lava-assets
          key: ${{ steps.hash.outputs.key }}

      # A cache entry is trusted for its key, the digest; this checks the
      # files under it still hash to it.
      - name: the cached copy is what the gate has
        if: steps.cache.outputs.cache-hit == 'true'
        run: bash deploy/ci/fetch_assets.sh --check "$HOME/lava-assets" "$HASH"
        env:
          HASH: ${{ steps.hash.outputs.hash }}

      - name: fetch from the gate
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash deploy/ci/fetch_assets.sh "$HOME/lava-assets" "$HASH"
        env:
          HASH: ${{ steps.hash.outputs.hash }}

      - name: keep them for the other jobs and later runs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/lava-assets
          key: ${{ steps.hash.outputs.key }}

      # The key has done its work here. The repository's own code runs next
      # (export_texts.py), and nothing it does needs the server.
      - name: forget the key
        if: always()
        run: rm -f "$HOME/.ssh/lava_gate"

      # The summary.txt the last run left (the "suites" job): the cut into
      # shards and the order, longest first. Read here, once, and handed to
      # every shard as this job's output -- a shard reading the cache itself
      # could meet a newer entry another run saved in between, cut the set
      # differently from its siblings, and leave a suite in no shard. None
      # on a first run, and then every shard takes the static order.
      - name: durations of the last run
        uses: actions/cache/restore@v4
        with:
          path: ~/suite/summary.txt
          key: suite-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: suite-durations-

      - name: the cut, for the shards
        id: durations
        run: |
          if [ -s "$HOME/suite/summary.txt" ]; then
            { echo "durations<<EOF_DURATIONS"; cat "$HOME/suite/summary.txt"; echo "EOF_DURATIONS"; } >> "$GITHUB_OUTPUT"
            echo "durations of the last run: $(wc -l < "$HOME/suite/summary.txt") suites"
          else
            echo "no durations yet: the shards take the static order"
          fi

      # export_texts.py exits non-zero if any id the server may put on the
      # wire is missing from the table (PROTOCOL.md 9): a missing row is a
      # player sent back to the login screen, not a blank label. The same
      # exporter builds the table into the client release on the server
      # (client/build.py), and the gate checks it equals what the new
      # server serves before the release is signed.
      - name: string table, every id on the wire in it
        run: |
          export LAVA_RES=$HOME/lava-assets/res
          out=$(python3 tools/export_texts.py -o "$RUNNER_TEMP/texts.xml")
          echo "$out"
          echo "string table: ${out##*/}, 0 ids missing, sha256 $(sha256sum < "$RUNNER_TEMP/texts.xml" | cut -c1-16)" >> "$GITHUB_STEP_SUMMARY"

  # The SQLite suites in three shards side by side, on three runners: each
  # cuts the same set the same way, by the durations assets handed over,
  # and runs its part four at once, longest first. Four at once, three
  # shards: twelve suites in all, about the 3.4 GB measured for twelve,
  # beside Postgres's ~1.2 GB at four, within the runners' 6 GB.
  suite:
    name: suites on SQLite, shard ${{ matrix.shard }}/3
    needs: assets
    runs-on: [self-hosted, lava]
    container:
      image: python:3.12-slim
      options: --init
    # A shard lasts about as long as its longest suite, test_halfa_open
    # (~9 min); a real failure adds its own length again, rerun.
    timeout-minutes: 45
    strategy:
      # The other shards finish even when one fails: their durations are
      # the next run's cut, and their failures are worth seeing at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: a clean work folder
        run: |
          r=${GITHUB_REPOSITORY#*/}
          find /__w -mindepth 1 -maxdepth 1 ! -name _actions ! -name _temp ! -name _tool -exec rm -rf {} +
          mkdir -p "/__w/$r/$r"
          if [ "$GITHUB_WORKSPACE" != "/__w/$r/$r" ]; then
            echo "::error title=Work folder::the workspace is $GITHUB_WORKSPACE, not /__w/$r/$r: something rewrote the runner's tracking file"
            exit 1
          fi

      - name: tools the image lacks
        run: |
          sed -i "s#http://deb.debian.org#${APT_MIRROR%/}#g" /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: ~/lava-assets
          key: ${{ needs.assets.outputs.key }}
          fail-on-cache-miss: true

      - name: the cached assets are what the gate has
        run: bash deploy/ci/fetch_assets.sh --check "$HOME/lava-assets" "$HASH"
        env:
          HASH: ${{ needs.assets.outputs.hash }}

      # The runner cuts the set and orders its part by the summary.txt in
      # its output folder: the same text on every shard.
      - name: a third of the suites, four at once, longest first
        id: run
        run: |
          export LAVA_RES=$HOME/lava-assets/res LAVA_ORIG_TEXTS=$HOME/lava-assets/texts.xml
          out=$HOME/shards/${{ matrix.shard }}
          mkdir -p "$out"
          if [ -n "$DURATIONS" ]; then
            printf '%s\n' "$DURATIONS" > "$out/summary.txt"
          fi
          bash tools/run_suite.sh --known tools/known_failures.txt --rerun \
            --shard ${{ matrix.shard }}/3 \
            --summary "$GITHUB_STEP_SUMMARY" . "$out" 4
        env:
          DURATIONS: ${{ needs.assets.outputs.durations }}

      # This shard's record, for the "suites" job: a cache entry of this run
      # alone (a job's own files do not outlive it on these runners).
      - name: this shard's durations
        if: ${{ !cancelled() && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: ~/shards/${{ matrix.shard }}/summary.txt
          key: suite-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}

      - name: output of every suite
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs-${{ matrix.shard }}
          path: ~/shards/${{ matrix.shard }}/
          retention-days: 7

  # One status for the three shards, and the check that between them they
  # ran every suite exactly once; their durations together are the next
  # run's cut. Its name is the one the single job had.
  suites:
    name: suites on SQLite
    needs: [assets, suite]
    if: ${{ !cancelled() && needs.assets.result == 'success' }}
    runs-on: [self-hosted, lava]
    container:
      image: python:3.12-slim
      options: --init
    timeout-minutes: 10
    steps:
      - name: a clean work folder
        run: |
          r=${GITHUB_REPOSITORY#*/}
          find /__w -mindepth 1 -maxdepth 1 ! -name _actions ! -name _temp ! -name _tool -exec rm -rf {} +
          mkdir -p "/__w/$r/$r"
          if [ "$GITHUB_WORKSPACE" != "/__w/$r/$r" ]; then
            echo "::error title=Work folder::the workspace is $GITHUB_WORKSPACE, not /__w/$r/$r: something rewrote the runner's tracking file"
            exit 1
          fi

      - name: tools the image lacks
        run: |
          sed -i "s#http://deb.debian.org#${APT_MIRROR%/}#g" /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: ~/shards/1/summary.txt
          key: suite-shard-${{ github.run_id }}-${{ github.run_attempt }}-1

      - uses: actions/cache/restore@v4
        with:
          path: ~/shards/2/summary.txt
          key: suite-shard-${{ github.run_id }}-${{ github.run_attempt }}-2

      - uses: actions/cache/restore@v4
        with:
          path: ~/shards/3/summary.txt
          key: suite-shard-${{ github.run_id }}-${{ github.run_attempt }}-3

      # Every suite of the tree ran, and once: a green run without one would
      # deploy what nothing tested.
      - name: every suite ran, and once
        id: merge
        run: |
          mkdir -p "$HOME/shards" "$HOME/suite"
          trap '[ -s "$HOME/suite/summary.txt" ] && echo "durations=yes" >> "$GITHUB_OUTPUT"' EXIT
          bash deploy/ci/merge_shards.sh "$HOME/shards" "$HOME/suite/summary.txt"

      - name: keep the durations for the next run
        if: ${{ !cancelled() && steps.merge.outputs.durations == 'yes' }}
        uses: actions/cache/save@v4
        with:
          path: ~/suite/summary.txt
          key: suite-durations-${{ github.run_id }}-${{ github.run_attempt }}

      - name: all three shards green
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error title=Suites::a shard failed ($SHARDS); its summary and its suite-logs artifact say which suites"
            exit 1
          fi
        env:
          SHARDS: ${{ needs.suite.result }}

  postgres:
    name: suites on Postgres
    needs: assets
    runs-on: [self-hosted, lava]
    container:
      image: python:3.12-slim
      options: --init
    timeout-minutes: 30
    # On the job's own network, by its name (LAVA_PG below); no port on the
    # host. Its data on a tmpfs: in memory, gone with the container, nothing
    # of it left on the runner's disk.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lava
          POSTGRES_PASSWORD: lavatest
          POSTGRES_DB: lava_test
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U lava -d lava_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: a clean work folder
        run: |
          r=${GITHUB_REPOSITORY#*/}
          find /__w -mindepth 1 -maxdepth 1 ! -name _actions ! -name _temp ! -name _tool -exec rm -rf {} +
          mkdir -p "/__w/$r/$r"
          if [ "$GITHUB_WORKSPACE" != "/__w/$r/$r" ]; then
            echo "::error title=Work folder::the workspace is $GITHUB_WORKSPACE, not /__w/$r/$r: something rewrote the runner's tracking file"
            exit 1
          fi

      - name: tools the image lacks
        run: |
          sed -i "s#http://deb.debian.org#${APT_MIRROR%/}#g" /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      # The image's own driver, at the image's own version (Dockerfile).
      - name: psycopg
        run: python3 -m pip install --quiet --no-cache-dir --disable-pip-version-check --root-user-action=ignore "psycopg[binary]==3.2.3"

      - uses: actions/cache/restore@v4
        with:
          path: ~/lava-assets
          key: ${{ needs.assets.outputs.key }}
          fail-on-cache-miss: true

      - name: the cached assets are what the gate has
        run: bash deploy/ci/fetch_assets.sh --check "$HOME/lava-assets" "$HASH"
        env:
          HASH: ${{ needs.assets.outputs.hash }}

      - name: each suite on a database of its own
        run: |
          export LAVA_RES=$HOME/lava-assets/res LAVA_ORIG_TEXTS=$HOME/lava-assets/texts.xml
          bash deploy/ci/pg_suites.sh "$HOME/pg" 4
        env:
          LAVA_PG: postgresql://lava:lavatest@postgres:5432

      - name: output of every suite
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-logs
          path: ~/pg/
          retention-days: 7

  deploy:
    name: deploy to production
    # preflight among the needs only for its output; a skipped assets (no
    # key) skips the suites and postgres, and with them this job.
    needs: [preflight, assets, suites, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.preflight.outputs.gate == 'true'
    runs-on: [self-hosted, lava]
    # ~/.ssh on a tmpfs, as in assets: the key never on the runner's disk.
    container:
      image: python:3.12-slim
      options: --init --tmpfs /github/home/.ssh:mode=0700,size=1m
    timeout-minutes: 30
    # One deploy at a time, and one that has begun is never cancelled: the
    # gate holds its own lock as well, and finishes a deploy -- or rolls it
    # back -- even if this job goes away.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # Above all here: the .git that actions/checkout gets must be its own,
      # not one an earlier job of some branch's run left behind.
      - name: a clean work folder
        run: |
          r=${GITHUB_REPOSITORY#*/}
          find /__w -mindepth 1 -maxdepth 1 ! -name _actions ! -name _temp ! -name _tool -exec rm -rf {} +
          mkdir -p "/__w/$r/$r"
          if [ "$GITHUB_WORKSPACE" != "/__w/$r/$r" ]; then
            echo "::error title=Work folder::the workspace is $GITHUB_WORKSPACE, not /__w/$r/$r: something rewrote the runner's tracking file"
            exit 1
          fi

      - name: tools the image lacks
        run: |
          sed -i "s#http://deb.debian.org#${APT_MIRROR%/}#g" /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends \
            ca-certificates git openssh-client rsync > /dev/null

      - uses: actions/checkout@v4

      # A rerun of an old run, or a run that waited behind a newer one, would
      # otherwise put older code over newer -- unless what is newer is prose
      # alone, which starts no run of its own (the script says how).
      - name: still what main runs?
        id: head
        run: bash deploy/ci/still_head.sh

      - name: gate access
        if: steps.head.outputs.go == 'true'
        run: bash deploy/ci/ssh_setup.sh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: pack the tree as deploy.sh would send it
        if: steps.head.outputs.go == 'true'
        run: bash deploy/ci/pack.sh "$RUNNER_TEMP/lava.tgz"

      - name: deploy through the gate
        if: steps.head.outputs.go == 'true'
        run: bash deploy/ci/send.sh "$RUNNER_TEMP/lava.tgz" "$GITHUB_SHA"

      - name: forget the key
        if: always()
        run: rm -f "$HOME/.ssh/lava_gate"
